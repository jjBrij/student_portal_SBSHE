# 1. Environment group to share identical variables across web and workers
envVarGroups:
  - name: student-portal-shared-env
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

services:
  # 2. Main Django Web App
  - type: web
    name: student-portal-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVarGroups:
      - student-portal-shared-env
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-portal-redis
          property: connectionString

  # 3. Celery Worker
  - type: worker
    name: student-portal-celery-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVarGroups:
      - student-portal-shared-env
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-portal-redis
          property: connectionString

  # 4. Celery Beat Scheduler
  - type: worker
    name: student-portal-celery-beat
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVarGroups:
      - student-portal-shared-env
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-portal-redis
          property: connectionString

  # 5. Redis Cache / Message Broker
  - type: redis
    name: student-portal-redis
    maxmemoryPolicy: noeviction

databases:
  # 6. PostgreSQL Database
  - name: student-portal-db
    databaseName: student_portal
    databaseUser: student_user