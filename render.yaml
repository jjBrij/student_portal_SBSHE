# Shared environment group definition
envVarGroups:
  - name: student-portal-shared-env
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

services:
  # 1. Main Django Web App
  - type: web
    name: student-portal-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - fromGroup: student-portal-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-portal-redis
          property: connectionString

  # 2. Celery Worker
  - type: worker
    name: student-portal-celery-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - fromGroup: student-portal-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-portal-redis
          property: connectionString

  # 3. Celery Beat Scheduler
  - type: worker
    name: student-portal-celery-beat
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVars:
      - fromGroup: student-portal-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-portal-redis
          property: connectionString

  # 4. Redis Cache / Message Broker
  - type: redis
    name: student-portal-redis
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Allows internal access while securing public access

databases:
  # 5. PostgreSQL Database
  - name: student-portal-db
    databaseName: student_portal
    user: student_user